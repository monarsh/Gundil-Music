name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.0 (needs docs/release-notes/<version>.md)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check
        run: |
          go vet ./...
          python -m py_compile internal/yt/helper.py
          node --check web/app.js
          bash -n scripts/install.sh scripts/install-termux.sh scripts/update-youtube.sh
      - name: Build all platforms
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
        run: ./scripts/build-all.sh
      - name: Add install scripts
        run: cp scripts/install.sh scripts/install-termux.sh scripts/update-youtube.sh dist/
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gundil-music
          path: dist/
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Gundil Music ${{ inputs.version || github.ref_name }}
          body_path: docs/release-notes/${{ inputs.version || github.ref_name }}.md
          make_latest: true
          files: dist/*

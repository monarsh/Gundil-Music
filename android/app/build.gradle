plugins {
    id 'com.android.application'
}

// Set by CI: -PversionName=1.1 -PversionCode=11
def vName = (project.findProperty('versionName') ?: '1.0').toString()
def vCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    namespace 'com.gundil.music'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gundil.music'
        minSdk 24
        targetSdk 35
        versionCode vCode
        versionName vName
    }

    signingConfigs {
        release {
            // CI provides a keystore; see .github/workflows/build.yml.
            def ks = System.getenv('ANDROID_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('ANDROID_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    // One APK per CPU family plus a universal one.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

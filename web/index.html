<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030303">
<title>Gundil Music</title>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tb-left">
      <button id="guide-btn" class="icon-btn" data-act="guide" aria-label="Guide"></button>
      <a class="logo" href="#/" aria-label="Gundil Music home"><img src="icon.svg" alt="" width="30" height="30"><span>Gundil Music</span></a>
    </div>
    <div class="tb-center">
      <form id="search-form" role="search" autocomplete="off">
        <button type="button" class="icon-btn search-back" data-act="search-close" aria-label="Back"></button>
        <span class="search-ico"></span>
        <input id="search" type="search" placeholder="Search songs, albums, artists, playlists" aria-label="Search" enterkeyhint="search">
        <button type="button" class="icon-btn search-clear" data-act="search-clear" aria-label="Clear search" hidden></button>
      </form>
      <div id="suggest" hidden></div>
    </div>
    <div class="tb-right">
      <button class="icon-btn mobile-only" data-act="search-open" aria-label="Search" id="m-search"></button>
      <button class="icon-btn cast-btn" data-act="cast" aria-label="Speakers and Bluetooth" title="Play on a speaker"></button>
      <button class="avatar" data-act="avatar-menu" aria-label="Account menu">G</button>
    </div>
  </header>

  <nav id="guide" aria-label="Main"></nav>

  <main id="main" tabindex="-1"><div id="view"></div></main>

  <section id="pp" aria-label="Now playing" hidden>
    <div class="pp-top">
      <button class="icon-btn" data-act="pp-close" aria-label="Close player" id="pp-close"></button>
      <div class="pp-where" id="pp-where"></div>
      <button class="icon-btn cast-btn" data-act="cast" aria-label="Speakers and Bluetooth"></button>
    </div>
    <div class="pp-main">
      <div class="pp-art" id="pp-art"></div>
      <div class="pp-info">
        <div class="pp-titles">
          <div class="pp-title" id="pp-title"></div>
          <div class="pp-sub" id="pp-sub"></div>
        </div>
        <div class="pp-actions">
          <div class="pill-group">
            <button class="pill-part" data-act="like-current" id="pp-like" aria-label="Like"></button>
            <button class="pill-part" data-act="dislike-current" id="pp-dislike" aria-label="Dislike"></button>
          </div>
          <button class="pill" data-act="save-current"><span class="ico-playlist-add"></span>Save</button>
          <button class="pill" data-act="share-current"><span class="ico-share"></span>Share</button>
        </div>
        <input id="pp-seek" class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
        <div class="pp-times"><span id="pp-pos">0:00</span><span id="pp-dur">0:00</span></div>
        <div class="pp-controls">
          <button class="icon-btn" data-act="shuffle" id="pp-shuffle" aria-label="Shuffle"></button>
          <button class="icon-btn big" data-act="prev" id="pp-prev" aria-label="Previous"></button>
          <button class="play-circle" data-act="toggle" id="pp-play" aria-label="Play"></button>
          <button class="icon-btn big" data-act="next" id="pp-next" aria-label="Next"></button>
          <button class="icon-btn" data-act="repeat" id="pp-repeat" aria-label="Repeat"></button>
        </div>
      </div>
    </div>
    <div class="pp-side" id="pp-side">
      <div class="pp-tabs" role="tablist">
        <button role="tab" data-act="pp-tab" data-tab="upnext">Up next</button>
        <button role="tab" data-act="pp-tab" data-tab="lyrics">Lyrics</button>
        <button role="tab" data-act="pp-tab" data-tab="related">Related</button>
      </div>
      <div class="pp-body" id="pp-body"></div>
    </div>
  </section>

  <footer id="bar" class="empty">
    <input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <div class="bar-left">
      <button class="icon-btn" data-act="prev" id="b-prev" aria-label="Previous"></button>
      <button class="icon-btn play-btn" data-act="toggle" id="b-play" aria-label="Play"></button>
      <button class="icon-btn" data-act="next" id="b-next" aria-label="Next"></button>
      <span class="b-time" id="b-time"></span>
    </div>
    <div class="bar-mid" data-act="pp-open">
      <div class="b-thumb" id="b-thumb"></div>
      <div class="b-text">
        <div class="b-title" id="b-title"></div>
        <div class="b-sub" id="b-sub"></div>
      </div>
      <div class="b-rate">
        <button class="icon-btn" data-act="dislike-current" id="b-dislike" aria-label="Dislike"></button>
        <button class="icon-btn" data-act="like-current" id="b-like" aria-label="Like"></button>
        <button class="icon-btn" data-act="current-menu" id="b-more" aria-label="More actions"></button>
      </div>
    </div>
    <div class="bar-right">
      <div class="vol">
        <button class="icon-btn" data-act="mute" id="b-vol" aria-label="Mute"></button>
        <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume">
      </div>
      <button class="icon-btn" data-act="repeat" id="b-repeat" aria-label="Repeat"></button>
      <button class="icon-btn" data-act="shuffle" id="b-shuffle" aria-label="Shuffle"></button>
      <button class="icon-btn" data-act="pp-toggle" id="b-expand" aria-label="Open player"></button>
    </div>
    <div class="mini-progress"><div id="mini-fill"></div></div>
  </footer>

  <nav id="bottomnav" aria-label="Main"></nav>
</div>

<div id="menu" role="menu" hidden></div>
<div id="scrim" hidden></div>
<dialog id="cast-dlg"></dialog>
<dialog id="dlg"></dialog>
<div id="toast" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
